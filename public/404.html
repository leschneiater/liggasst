<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>LiggaSST</title>
    <!-- Fallback SPA para GitHub Pages: links diretos (/liggasst/politica-de-privacidade etc.)
         chegam aqui; guardamos o caminho e voltamos para a raiz do app, que o restaura. -->
    <script>
      sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
      location.replace('/liggasst/');
    </script>
  </head>
  <body></body>
</html>
